name: aidel-lms
services:
- name: web
  source_dir: /
  github:
    repo: Kiyoraka/Aidel-Learning-Management-System
    branch: main
    deploy_on_push: true
  build_command: composer install --no-dev --optimize-autoloader --no-interaction && npm ci --only=production && npm run build && php artisan config:clear
  run_command: php artisan storage:link && php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && heroku-php-apache2 public/
  environment_slug: php
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 80
  envs:
  - key: APP_NAME
    value: "LMS Prototype"
  - key: APP_ENV
    value: production
  - key: APP_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: APP_DEBUG
    value: "false"
  - key: APP_URL
    value: ${APP_URL}
  - key: DB_CONNECTION
    value: mysql
  - key: DB_HOST
    value: ${db.HOSTNAME}
  - key: DB_PORT
    value: ${db.PORT}
  - key: DB_DATABASE
    value: ${db.DATABASE}
  - key: DB_USERNAME
    value: ${db.USERNAME}
  - key: DB_PASSWORD
    value: ${db.PASSWORD}
  - key: MAIL_MAILER
    value: smtp
  - key: MAIL_HOST
    value: smtp.gmail.com
  - key: MAIL_PORT
    value: "587"
  - key: MAIL_USERNAME
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: MAIL_PASSWORD
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: MAIL_ENCRYPTION
    value: tls

databases:
- name: db
  engine: MYSQL
  version: "8"
  size: basic-xs
  num_nodes: 1 