upload_max_filesize = 500M
post_max_size = 500M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M

; php2shell (CVE-2026-109618 / CVE-2026-109619) defence in depth - Oct 22 2026
; Laravel uses its own session handler, never PHP's native upload-progress tracking
; memory_limit stays bounded above - the patched PHP is the fix, -1 would risk an OOM-kill on big uploads
session.upload_progress.enabled = 0
